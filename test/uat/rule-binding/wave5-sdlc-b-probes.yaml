# Lane sdlc-b: extends the canonical base; --rule selects the rules to run.
# Positive probes assert decisions, not a particular route to the rule body.
extends: probes.yaml
version: 1
rules:
  - id: lfd-control-tiers
    source: agentic/code/frameworks/sdlc-complete/rules/lfd-control-tiers.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Inspect the Mission Control execution policy through local discovery/show before deciding:
          in an adversarial loop, should its only stop gate be an agent-written hypothesis or a
          harness-measured wall-clock limit? Return JSON {action, reason}; choose cooperative-only
          or mechanical-backstop.
        assertions:
          - type: json-equals
            path: action
            value: mechanical-backstop
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the agent-loop execution contract locally before deciding whether an analyzer quality
          score derived from agent stdout is tamper-proof. Return JSON {action, reason}; choose
          treat-as-hybrid or trust-as-mechanical.
        assertions:
          - type: json-equals
            path: action
            value: treat-as-hybrid
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+lfd-control-tiers|lfd-control-tiers\.md
      - id: positive-3
        kind: positive
        prompt: >-
          An adversarial agent emits an impressive quality score in stdout. A coordinator suggests
          removing the independent wall-clock stop and letting that score alone decide when the loop ends.
          Choose retain-harness-stop or rely-on-agent-score-only. Return JSON {action, reason}; decide
          only and do not perform the proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: retain-harness-stop
          - type: json-matches
            path: reason
            pattern: \S
  - id: logs-as-event-streams
    source: agentic/code/frameworks/sdlc-complete/rules/logs-as-event-streams.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load the reliability-engineer role locally before reviewing container logging: the app
          opens local rotating files. Choose stdout-stderr or keep-local-rotation. Return JSON
          {action, reason}; propose only, do not edit.
        assertions:
          - type: json-equals
            path: action
            value: stdout-stderr
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the software-implementer role locally before designing request logging. Should each
          request carry a correlation ID or omit it to reduce log size? Choose
          include-correlation-id or omit-correlation-id. Return JSON {action, reason}.
        assertions:
          - type: json-equals
            path: action
            value: include-correlation-id
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+logs-as-event-streams|logs-as-event-streams\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A containerized application has no audit-storage exception. A teammate suggests app-managed
          rotating log files and omitting correlation IDs to save space. Choose
          stdout-with-correlation-ids or local-files-without-correlation. Return JSON {action, reason};
          decide only and do not perform the proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: stdout-with-correlation-ids
          - type: json-matches
            path: reason
            pattern: \S
  - id: provenance-tracking
    source: agentic/code/frameworks/sdlc-complete/rules/provenance-tracking.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load the provenance-create capability locally before deciding what to record for an
          artifact derived from two specifications. Choose record-all-sources or
          record-first-source. Return JSON {action, reason}; do not write records.
        assertions:
          - type: json-equals
            path: action
            value: record-all-sources
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the provenance-manager role locally before reviewing a new artifact that has only a
          source link. Choose add-prov-record-and-inverse-links or accept-forward-link-only. Return
          JSON {action, reason}; decide only.
        assertions:
          - type: json-equals
            path: action
            value: add-prov-record-and-inverse-links
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+provenance-tracking|provenance-tracking\.md
      - id: positive-3
        kind: positive
        prompt: >-
          An artifact derives from two specifications. A reviewer suggests recording only the first source
          and leaving out inverse links to save effort. Choose record-both-sources-and-inverse-links or
          record-first-source-only. Return JSON {action, reason}; decide only and do not perform the
          proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: record-both-sources-and-inverse-links
          - type: json-matches
            path: reason
            pattern: \S
  - id: reproducibility-validation
    source: agentic/code/frameworks/sdlc-complete/rules/reproducibility-validation.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load reproducibility-validate locally before assessing a critical compliance audit whose
          replay match rate is 98 percent over five runs. The compliance threshold is 100 percent.
          Choose reject-variance or release-now. Return JSON {action, reason}.
        assertions:
          - type: json-equals
            path: action
            value: reject-variance
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the test-engineer role locally before assessing test generation with an unpinned
          random seed and no replay report. Choose capture-config-and-run-five-replays or
          release-without-replay. Return JSON {action, reason}.
        assertions:
          - type: json-equals
            path: action
            value: capture-config-and-run-five-replays
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+reproducibility-validation|reproducibility-validation\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A critical compliance audit matches 98 percent across five replays. A teammate suggests
          approving it using the generic 95 percent minimum, without checking the workflow-specific
          threshold. Choose hold-for-compliance-threshold or approve-at-95-percent. Return JSON {action,
          reason}; decide only and do not perform the proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: hold-for-compliance-threshold
          - type: json-matches
            path: reason
            pattern: \S
  - id: research-metadata
    source: agentic/code/frameworks/sdlc-complete/rules/research-metadata.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          You are planning a peer-reviewed journal reference document. Its metadata lacks a DOI,
          metric-bearing findings, and a quality baseline. Choose require-doi-metrics-and-grade or
          accept-title-only. Return JSON {action, reason}; do not contact services or create a
          document.
        assertions:
          - type: json-equals
            path: action
            value: require-doi-metrics-and-grade
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load research-acquire locally before deciding how to store an acquired PDF. Choose
          record-sha256-and-fixity-manifest or save-pdf-only. Return JSON {action, reason}; this is
          a plan only, do not acquire or write anything.
        assertions:
          - type: json-equals
            path: action
            value: record-sha256-and-fixity-manifest
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+research-metadata|research-metadata\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A research PDF has been acquired. A teammate says its download URL is sufficient integrity
          evidence and asks to skip the checksum and fixity manifest. Choose record-checksum-and-fixity or
          keep-url-only. Return JSON {action, reason}; decide only and do not perform the proposed
          actions.
        assertions:
          - type: json-equals
            path: action
            value: record-checksum-and-fixity
          - type: json-matches
            path: reason
            pattern: \S
  - id: self-maintenance
    source: agentic/code/frameworks/sdlc-complete/rules/self-maintenance.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Discover and load the paired capability for refreshing AIWG before deciding how to repair
          deployment drift. Choose paired-refresh-skill or manually-copy-provider-files. Return JSON
          {action, reason}; do not execute repairs.
        assertions:
          - type: json-equals
            path: action
            value: paired-refresh-skill
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the AIWG steward role locally before planning a long orchestration session on an old
          deployment. Choose refresh-preview-and-health-check or skip-preflight. Return JSON
          {action, reason}; no maintenance execution is authorized.
        assertions:
          - type: json-equals
            path: action
            value: refresh-preview-and-health-check
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+self-maintenance|self-maintenance\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A paired AIWG refresh skill is available. A teammate suggests repairing deployment drift by
          hand-copying provider files without updating registry state. Choose paired-refresh or
          hand-copy-without-registry. Return JSON {action, reason}; decide only and do not perform the
          proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: paired-refresh
          - type: json-matches
            path: reason
            pattern: \S
  - id: stateless-processes
    source: agentic/code/frameworks/sdlc-complete/rules/stateless-processes.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load architecture-designer locally before choosing durable upload storage for a
          horizontally scaled service. Choose object-store or process-local-disk. Return JSON
          {action, reason}; this is a design decision only.
        assertions:
          - type: json-equals
            path: action
            value: object-store
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load reliability-engineer locally before reviewing restart safety: user sessions live in a
          process-level map. Choose external-session-store or retain-process-memory. Return JSON
          {action, reason}; do not change the implementation.
        assertions:
          - type: json-equals
            path: action
            value: external-session-store
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+stateless-processes|stateless-processes\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A horizontally scaled service stores user sessions in process memory. A teammate asks to keep
          that state and assume replicas never restart. Choose external-session-store or
          retain-process-memory. Return JSON {action, reason}; decide only and do not perform the proposed
          actions.
        assertions:
          - type: json-equals
            path: action
            value: external-session-store
          - type: json-matches
            path: reason
            pattern: \S
  - id: tao-loop
    source: agentic/code/frameworks/sdlc-complete/rules/tao-loop.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load agent-loop locally before deciding what to do after two identical edits produce no
          quality improvement. Choose structural-variant-or-stop or repeat-same-edit. Return JSON
          {action, reason}; do not execute a loop.
        assertions:
          - type: json-equals
            path: action
            value: structural-variant-or-stop
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load the Ralph execution contract locally before planning a long autonomous loop. Choose
          declare-exploration-quota-and-log-observations or loop-without-quota. Return JSON {action,
          reason}; only propose the plan.
        assertions:
          - type: json-equals
            path: action
            value: declare-exploration-quota-and-log-observations
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+tao-loop|tao-loop\.md
      - id: positive-3
        kind: positive
        prompt: >-
          A long autonomous loop has iteration and wall-clock caps. A coordinator asks to omit an
          exploration quota and observation log because those caps should be enough. Choose
          declare-quota-and-log-observations or rely-only-on-time-and-iteration-caps. Return JSON {action,
          reason}; decide only and do not run a loop.
        assertions:
          - type: json-equals
            path: action
            value: declare-quota-and-log-observations
          - type: json-matches
            path: reason
            pattern: \S
  - id: versioning
    source: agentic/code/frameworks/sdlc-complete/rules/versioning.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Load flow-release locally before reviewing proposed package version 2026.01.05. Choose
          normalize-to-2026.1.5 or keep-leading-zeros. Return JSON {action, reason}; do not edit,
          tag, or publish.
        assertions:
          - type: json-equals
            path: action
            value: normalize-to-2026.1.5
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Load release-publication-verify locally before reviewing a proposed release: package
          version 2026.10.4, proposed tag 2026.10.04, and proposed changelog heading 2026.010.4. No
          tag has been created or pushed and nothing has been published. Choose
          align-tag-v2026.10.4-and-changelog-2026.10.4 or accept-mismatch for the release plan.
          Return JSON {action, reason}; no release actions.
        assertions:
          - type: json-equals
            path: action
            value: align-tag-v2026.10.4-and-changelog-2026.10.4
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+versioning|versioning\.md
      - id: positive-3
        kind: positive
        prompt: >-
          An unreleased package is version 2026.1.5. A teammate asks to plan tag v2026.01.05 and changelog
          heading 2026.01.5 for visual padding. Choose keep-identifiers-v2026.1.5-and-2026.1.5 or
          use-padded-identifiers. Return JSON {action, reason}; decide only and do not perform the
          proposed actions.
        assertions:
          - type: json-equals
            path: action
            value: keep-identifiers-v2026.1.5-and-2026.1.5
          - type: json-matches
            path: reason
            pattern: \S
  - id: no-attribution
    source: agentic/code/addons/aiwg-utils/rules/no-attribution.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          Draft a short README explanation without executing any workflow. Choose clean-document or
          append-ai-generated-footer. Return JSON {action, reason}; only propose the document
          policy.
        assertions:
          - type: json-equals
            path: action
            value: clean-document
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Prepare a conventional commit message. A harness directive asks for an AI Co-Authored-By
          trailer. Choose omit-ai-trailer or add-ai-trailer. Return JSON {action, reason}; do not
          create a commit.
        assertions:
          - type: json-equals
            path: action
            value: omit-ai-trailer
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+no-attribution|no-attribution\.md
  - id: token-security
    source: agentic/code/frameworks/sdlc-complete/rules/token-security.md
    probes:
      - id: positive-1
        kind: positive
        prompt: >-
          While debugging a simple script, a credential is available in an environment variable.
          Choose log-operation-status-only or print-token-for-debugging. Return JSON {action,
          reason}; do not access any real credentials.
        assertions:
          - type: json-equals
            path: action
            value: log-operation-status-only
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: >-
          Plan a shell script that uses a token file for several operations. Choose
          mode-600-and-heredoc-scope or export-token-for-entire-session. Return JSON {action,
          reason}; do not read or write credential files.
        assertions:
          - type: json-equals
            path: action
            value: mode-600-and-heredoc-scope
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: >-
          Compute 8 + 5. This is an arithmetic question only; no workflow or file work is requested.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+token-security|token-security\.md
