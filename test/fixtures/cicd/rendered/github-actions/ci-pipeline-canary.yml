# Inert golden preview; never installed as AIWG CI.
# Recipe: agentic/code/extensions/cicd-github-actions/templates/cicd-github-actions-workflow.md v1.0.0
# Source: test/fixtures/cicd/valid/ci-pipeline-canary.json + ci-environment.json
# Requires reviewed project adapters/bindings and provisioned Node 24 runtime.
name: ci-canary
'on':
  push:
    branches:
      - main
    paths:
      - src/**
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ci-unit:
    runs-on:
      - self-hosted
      - linux
      - ci-untrusted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-cache
          key: ${{ runner.os }}-ci-untrusted-node24-${{ hashFiles('package-lock.json') }}
      - name: Invoke ci-test
        env:
          CI_BINDINGS: ci/bindings.json
          CI_CAPABILITY: ci-test
          CI_INPUTS: '{"suite":"unit"}'
          CI_RETRY: '{"max_attempts":3,"backoff":"exponential"}'
        run: node ci/capability.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-unit-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
  ci-build:
    runs-on:
      - self-hosted
      - linux
      - ci-untrusted
    needs:
      - ci-unit
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Invoke docker-build
        env:
          CI_BINDINGS: ci/bindings.json
          CI_CAPABILITY: docker-build
          CI_INPUTS: '{}'
          CI_RETRY: '{"max_attempts":1}'
        run: node ci/capability.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-build-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
  ci-test-gate-1:
    runs-on:
      - self-hosted
      - linux
      - ci-untrusted
    needs:
      - ci-unit
      - ci-build
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Evaluate entry GatePack
        env:
          CI_BINDINGS: ci/bindings.json
          CI_GATE: '{"pack":"aiwg:dev/ci-flake","after":"ci-test","parameters":{"requiredRuns":50}}'
        run: node ci/gate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-test-gate-1-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
  ci-release:
    runs-on:
      - self-hosted
      - linux
      - ci-runner
    needs:
      - ci-build
      - ci-test-gate-1
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    environment:
      name: ci-production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Verify environment protection and approval
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_PROTECTION: '{"required_reviewers":2,"branch_restrictions":["main","release/*"]}'
        run: node ci/approval.mjs
      - name: Invoke ci-deploy-handoff
        env:
          CI_BINDINGS: ci/bindings.json
          CI_CAPABILITY: ci-deploy-handoff
          CI_INPUTS: '{}'
          CI_RETRY: '{"max_attempts":1}'
          CI_ENVIRONMENT: ci-production
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node ci/capability.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
  ci-release-rollout:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on:
      - self-hosted
      - linux
      - ci-runner
    needs:
      - ci-release
      - ci-test-gate-1
    environment:
      name: ci-production
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Verify environment protection and approval
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_PROTECTION: '{"required_reviewers":2,"branch_restrictions":["main","release/*"]}'
        run: node ci/approval.mjs
      - name: Evaluate entry GatePack
        env:
          CI_BINDINGS: ci/bindings.json
          CI_GATE: '{"pack":"aiwg:dev/ci-flake","after":"ci-test","parameters":{"requiredRuns":50}}'
        run: node ci/gate.mjs
      - name: Execute gated canary ramp and verified rollback
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_CAPABILITY: ci-deploy-handoff
          CI_ROLLOUT: '{"strategy":"canary","steps":[{"weight":10,"pause":"5m","gate":"aiwg:dev/ci-flake"},{"weight":100}],"gates":[{"pack":"aiwg:dev/ci-flake","after":"ci-test","parameters":{"requiredRuns":50}}],"rollback":{"on":["gate-failure","manual"],"capability":"ci-deploy-handoff"}}'
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node ci/rollout.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-release-rollout-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
