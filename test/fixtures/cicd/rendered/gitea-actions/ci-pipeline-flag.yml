# Inert golden preview; never installed as AIWG CI.
# Recipe: agentic/code/extensions/cicd-gitea-actions/templates/cicd-gitea-actions-workflow.md v1.0.0
# Source: test/fixtures/cicd/valid/ci-pipeline-flag.json + ci-environment.json
# Requires reviewed project adapters/bindings and provisioned Node 24 runtime.
# Adds the default health gate; Gitea projection is a test target override only.
name: ci-flag
'on':
  workflow_dispatch: {}
jobs:
  ci-publish:
    runs-on:
      - linux
      - ci-runner
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    steps:
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify environment protection and approval
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_PROTECTION: '{"required_reviewers":2,"branch_restrictions":["main","release/*"]}'
        run: node ci/approval.mjs
      - name: Invoke docker-push
        env:
          CI_BINDINGS: ci/bindings.json
          CI_CAPABILITY: docker-push
          CI_INPUTS: '{}'
          CI_RETRY: '{"max_attempts":1}'
          CI_ENVIRONMENT: ci-production
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node ci/capability.mjs
      - uses: https://github.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d # v3.2.1-node20
        with:
          name: ci-publish-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
  ci-release-rollout:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on:
      - linux
      - ci-runner
    needs:
      - ci-publish
    steps:
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify environment protection and approval
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_PROTECTION: '{"required_reviewers":2,"branch_restrictions":["main","release/*"]}'
        run: node ci/approval.mjs
      - name: Execute gated flag ramp and verified rollback
        env:
          CI_BINDINGS: ci/bindings.json
          CI_ENVIRONMENT: ci-production
          CI_CAPABILITY: progressive-rollout
          CI_ROLLOUT: '{"strategy":"flag","steps":[{"percentage":5,"pause":"10m"},{"percentage":100}],"rollback":{"on":["gate-failure"],"capability":"ci-deploy-handoff"}}'
          CI_HEALTH_GATE: aiwg:cicd-complete/progressive-rollout-health
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node ci/rollout.mjs
      - uses: https://github.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d # v3.2.1-node20
        with:
          name: ci-release-rollout-${{ github.sha }}
          path: ci-evidence/
          retention-days: 7
          if-no-files-found: error
