id: aiwg-prompt-discovery
description: Bounded prompt-time capability candidates and show/rules/apply guidance
events: [UserPromptSubmit]
command: node
args: ['$AIWG_ROOT/agentic/code/addons/aiwg-hooks/hooks/aiwg-prompt-discovery.cjs']
timeout: 2
# These bridges cannot inject prompt context; their startup rules require discovery.
# Muse uses its project hook owner; Claude uses claude-hooks-installer.
# Hermes uses pre_llm_call shell hooks with a native {context} response.
degrade-on: [copilot, grok-build]
