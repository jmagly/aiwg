apiVersion: ops.aiwg.io/v1
kind: OpsCapability
metadata:
  name: flag-states-test
  labels:
    category: progressive-delivery
  annotations:
    blast-radius: "test-only flag overrides; restore prior test state"
spec:
  description: "Run the same suite and revision with referenced flags forced off and forced on in an isolated test context; restore overrides afterward. Emit both exit statuses and a revision-bound report consumed by flag-check. Resolve the implementation from project feature_flags.provider through its provider addon; provider none requires a manual approval gate with recorded evidence. This resource is a provider-neutral definition only."
  version: "1.0.0"
  inputs:
    - name: flags
      type: list
      required: true
    - name: suite
      type: string
      required: true
    - name: revision
      type: string
      required: true
    - name: workspace
      type: path
      required: true
    - name: project
      type: string
      required: false
    - name: provider_options
      type: object
      required: false
  outputs:
    - name: off_exit_code
      type: integer
    - name: on_exit_code
      type: integer
    - name: revision
      type: string
    - name: flags
      type: list
    - name: approval_ref
      type: string
    - name: evidence_path
      type: path
  idempotent: true
  verification:
    command: "jq -e '.off_exit_code == 0 and .on_exit_code == 0 and (.revision | length > 0)' '{{ evidence_path }}'"
    expect: "true"
