apiVersion: ops.aiwg.io/v1
kind: OpsCapability
metadata:
  name: ci-test
  labels:
    category: ci
  annotations:
    blast-radius: "test workspace and configured test dependencies"
spec:
  description: "Run the requested suite in an isolated workspace. Preserve test totals, failures, exit status and a machine-readable report; fail on failed tests, missing results or a nonzero exit. Use aiwg:dev/ci-flake from $AIWG_ROOT/agentic/code/extensions/dev/gate-packs/ci-flake.gatepack.yaml for repeated-run flake gating."
  version: "1.0.0"
  inputs:
    - name: suite
      type: string
      required: true
    - name: workspace
      type: path
      required: true
    - name: command
      type: string
      required: true
  outputs:
    - name: exit_code
      type: integer
    - name: tests_total
      type: integer
    - name: tests_failed
      type: integer
    - name: report_path
      type: path
    - name: evidence_path
      type: path
  idempotent: true
  verification:
    command: "jq -e '.exit_code == 0 and .tests_total > 0 and .tests_failed == 0' '{{ evidence_path }}'"
    expect: "true"
