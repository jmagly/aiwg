# Conversion capability (#1539) — flow-construction-to-transition Step 7 (PRM validation).
apiVersion: flow.aiwg.io/v1
kind: FlowCapability
metadata:
  name: c2t-prm-validation
  labels: { domain: transition }
spec:
  description: >-
    Validate all Product Release Milestone (PRM) criteria — production deployment and hypercare
    completed, production stability (uptime SLA, zero P0/P1, performance within targets), user
    adoption (≥80% trained, UAT passed, satisfaction ≥4/5), support and operations handover
    signoffs, and business-value tracking; report PASS | CONDITIONAL PASS | FAIL. Read
    feature-toggle cards under .aiwg/deployment/ without a vendor connection. Invoke
    $AIWG_ROOT/agentic/code/frameworks/sdlc-complete/skills/feature-flag-plan/scripts/flag-plan.mjs debt with explicit as_of and optional
    temporary_flag_caps from solution-profile; list temporary flags past removal criteria or
    optional review-by date, evidence, owner, removal task and live temporary count per service
    versus optional cap. Report metadata gaps. Use ready for code removal / ready to archive as
    local workflow labels; do not infer vendor lifecycle eligibility. Route optional installed
    provider cleanup skills via feature_flags.provider per $AIWG_ROOT/docs/frameworks/sdlc-complete/feature-flags.md;
    none/missing addon stays card-only. Debt is advisory. [AIWG guidance] Optional inventory
    caps/removal tasks: https://martinfowler.com/articles/feature-toggles.html ; review dates:
    https://docs.getunleash.io/guides/feature-flag-best-practices.md ; vendor lifecycle terms:
    https://launchdarkly.com/docs/home/flags/flag-status.md .
  version: "1.0.0"
  inputs:
    - { name: hypercare_decision, type: string, required: false }
  outputs:
    - { name: prm_status, type: string }
  agent: project-manager
  idempotent: true
