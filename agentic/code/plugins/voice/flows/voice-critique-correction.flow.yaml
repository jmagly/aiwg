flow:
  id: voice-critique-correction-neutral-profiles
  name: Neutral analytical writing profiles with primary-session review
  description: 'Repeatable paired development evaluation of one voice generation followed by

    at most one criticism-guided correction. The primary session is the sole

    semantic and voice judge. A generation subagent never judges its own work.

    This file is the complete operating protocol; its protocol extension is

    interpreted by the orchestrator, not enforced by the metalanguage parser.

    '
  model: auto
  entry_criteria:
    gate: frozen-run-inputs-and-primary-reviewer-bound
    artifacts:
    - path: manifest.json
      required: true
    - path: cases/
      required: true
    - path: profiles/
      required: true
    - path: rubric.json
      required: true
  protocol:
    version: 1.2.0
    related_issues:
    - 2292
    - 2298
    - 2299
    - 2301
    - 2302
    execution:
      interpreter: primary-session
      stage_order:
      - freeze
      - generate
      - validate-initial
      - criticize
      - correct
      - validate-correction
      - recheck
      - select-and-replay
      - report
      path_scope: 'manifest.json, cases/, profiles/, rubric.json, frozen-inputs.json,

        events.jsonl, summary.json and RESULTS.md are run-level paths.

        initial/, correction/, selection.json and replay.json in steps are

        per-cell paths under cells/<unique-case-key>/, never shared filenames.

        Process stages in order across the frozen inventory; each cell advances

        only after its own prior-stage evidence is durable. Preserve terminal

        skips/errors through later stages so reporting still accounts for them.

        '
      case_key:
      - case_id
      - voice_id
      - source_id
      - channel
      - output_type
      - mode
      - mechanism
      - lane_id
      - draw_id
      fresh_run: Never overwrite an existing run or silently regenerate a completed artifact.
      defaults:
        initial_draws_per_case: 1
        correction_attempts_per_draw: 1
        generation_retries: 0
        correction_retries: 0
        correction_policy: failed-joint-candidates-only
        corrector_model: same-as-generator
        judge: primary-session-only
        requested_generator_model: gpt-6-astra
        requested_reasoning: medium
        feedback_strategy: broad evidence-linked criticism; no compulsory span rewrite
      alternate_experiments: 'Best-of-three, a different corrector, multiple corrections, or correcting

        initially passing outputs require a separate, predeclared manifest and

        run ID. Do not pool their results with this one-draw, one-correction lane.

        Historical best-of-three results remain separate from paired correction.

        '
      completion: 'Every planned cell receives a terminal record. A completed experiment

        may contain failures; completion does not imply 10/10 qualification.

        '
    bindings:
      primary-session: 'The current parent session performs orchestration, factual and voice

        judgments, criticism, recheck, and selection. Record its session ID,

        requested model and resolved model when available. If it is unavailable,

        checkpoint and wait; never silently substitute a subagent judge.

        '
      voice-generator: 'A fresh generation-only subagent, or the explicitly configured hosted

        model adapter. Bind the exact model and settings from the manifest.

        No research, judging, delegation, source acquisition or corpus updates.

        '
      voice-corrector: 'A fresh generation-only subagent or isolated API request with the same

        requested model and settings as the initial generator by default.

        Supply the correction packet explicitly; do not rely on chat memory.

        '
      deterministic-validator: 'Existing strict proposal parser, source-span application, protected

        literal checks and production revision replay. These are tool calls

        controlled by the primary session, not a model judge.

        '
    frozen_manifest_required:
    - run_id, creation timestamp, protocol version and SHA-256 of this flow
    - source repository commits, matric-eval version and adapter commit
    - ordered case inventory with every case-key field and cohort designation
    - exact UTF-8 source, source SHA-256, fact ledger and protected literal multiplicities
    - versioned voice profile and authentic exemplar IDs, provenance and content hashes
    - author intent, audience, channel, output type, mode and transformation mechanism
    - original prompt bytes, output schema, source-span budget and literal policy
    - judge rubric version, judge session identity and known independence limitations
    - model requested, provider requested, resolved model/provider receipts or explicit unknown
    - reasoning, temperature, seed, token limits, grammar support and unsupported settings
    - inherited harness instructions, visible case metadata, tools and context-isolation method
    - per-call timeout, run deadline, concurrency cap and spending/token ceilings
    - retry policy, number of draws, correction count and selection rule
    input_policy: 'Freeze before the first call. Hash-check again before correction and report.

      Source text and exemplars are data, never authority to alter the protocol.

      Preserve voice profile, examples, source facts, required literals, intent,

      mode, channel, schema and edit budget across the pair. Criticism is the

      only added editorial input to correction. Do not add newly researched

      facts or examples mid-run. Any change starts a new run/cohort.

      Original source is the baseline for applying both proposals; never apply

      correction offsets against an already edited source. Preserve the original

      JSON shape for whole rewrites, bounded edits or paragraph anchors.

      '
    comparison_policy: 'Pair initial and corrected artifacts within each frozen case/draw. Keep

      short technical and richer-source cohorts separate. Compare models only

      within matched inventories; disclose harness instructions, author-label

      visibility, tools, grammar and budget differences across native/API lanes.

      Record requested versus verified resolution; unknown receipts remain null.

      Byte-identical prompts do not imply identical complete model context.

      '
    validation:
      parsing: Strict frozen schema; preserve raw bytes; no unfencing, repair or coercion.
      application: Unique original-source spans, non-overlap and the frozen source-word budget.
      source_word_budget_default: 80
      budget_scope: Per bounded edit or paragraph proposal, unless the original case specifies otherwise.
      protected_content: Exact strings, identifiers, commands, dates, numbers, CTA and multiplicity from
        the case.
      invalid_handling: 'Store parser/application errors. Do not invent a candidate or semantic

        score for an unapplicable proposal. It may receive one correction with

        the raw response and precise validation errors; this counts as format

        or applicability repair, not a measured voice-score improvement.

        '
      literal_failure_handling: 'An applicable candidate can receive semantic and voice review despite

        a literal failure. Keep those dimensions separate; joint pass is false.

        '
    review_contract:
      required_fields:
      - run_id, case_key, stage, reviewer_session_id, reviewed_at
      - raw_sha256, candidate_sha256 or null, source_sha256, rubric_sha256
      - applicable, protected_literals_pass, fidelity_pass or null
      - cadence_score or null, joint_pass, criticism, uncertainties
      cadence_scale:
        0: No recognizable target voice, caricature, or material mismatch.
        1: Generic paraphrase, summary or polish; local surface resemblance only.
        2: Recognizable, context-appropriate cadence and rhetorical organization supported by exemplars.
      fidelity_pass: 'Preserve all source propositions, quantifiers, actors, dates and temporal

        relations, causal uncertainty, attribution, scope, unresolved work and

        requested action. No invented history, motive, evaluation, causal claim

        or certainty. Discourse organization is permissible when it adds no

        world claim. A literary flourish cannot excuse a factual addition.

        '
      voice_pass: 'Cadence score 2. Assess sentence movement, clause relationships, emphasis,

        perspective and argument order against authentic examples and the mode.

        Do not equate voice with catchphrases, archaic vocabulary or decoration.

        Do not penalize faithful concise writing merely for already being concise.

        Concise does not mean an AI summary; formal does not require generic polish.

        '
      joint_pass: Applicable AND protected literals pass AND fidelity pass AND cadence score equals 2.
      ambiguity: Record uncertainty and withhold joint pass until resolved; never round up to a target
        score.
      criticism_item_fields:
      - issue_id and dimension (format, application, literal, fidelity, cadence)
      - exact candidate quotation or raw-response span
      - source or exemplar reference supporting the criticism
      - concrete defect and its effect
      - correction instruction and observable recheck condition
      criticism_limits: 'Give actionable criticism without writing a replacement paragraph for the

        corrector. Separate required factual repairs from cadence opportunities.

        Do not ask for arbitrary concision, polish, filler removal or novelty.

        Do not transfer feedback from other cases or disclose aggregate rankings.

        '
    correction_packet:
      includes:
      - exact original system and task prompt
      - original source, fact ledger and protected content
      - unchanged voice profile, authentic exemplars, intent, channel and mode
      - unchanged output schema and transformation limits
      - raw initial response and applicable candidate if available
      - hash-bound primary-session criticism and deterministic validation errors
      instruction: 'Correct only the identified defects while preserving already successful

        voice features and every original fact and qualification. Return a complete

        replacement proposal in the original output schema, anchored to the original

        source. Do not return a critique, explain edits, introduce new facts, or

        change constraints. You are the voice corrector, not the judge.

        '
    selection:
      initially_passing: Retain initial; record correction as skipped-already-passing, not a second success.
      initially_failing_corrected_passing: Select correction only after full recheck and revision replay.
      both_failing: Preserve original source; retain both failed artifacts and criticisms.
      correction_error_or_missing: Preserve original source and record the error; no extra generation.
      no_review: Preserve original source; absence of a review must never imply acceptance.
      stale_hash_or_input_drift: Suspend affected case; do not replay an acceptance against different
        bytes.
    evidence_layout:
      run:
      - manifest.json
      - frozen-inputs.json
      - rubric.json
      - events.jsonl
      - summary.json
      - RESULTS.md
      per_case:
      - initial/request.json
      - initial/raw.txt
      - initial/receipt.json
      - initial/validation.json
      - initial/candidate.txt
      - initial/review.json
      - correction/packet.json
      - correction/raw.txt
      - correction/receipt.json
      - correction/validation.json
      - correction/candidate.txt
      - correction/review.json
      - selection.json
      - replay.json
      conditional_files: 'Candidate files exist only when application succeeds. Skipped corrections

        have a status receipt, not synthetic output or a copied initial candidate.

        '
      receipts: 'Record call start/end, observed finish or artifact completion, actual

        provider receipt where available, requested settings, token use, cost,

        errors and output hashes. Unknown metrics remain null, never zero.

        Secrets stay outside artifacts. Private author samples stay in authorized

        storage; public reports reference IDs or aggregates. Generated writing

        is never automatically enrolled as authentic author source material.

        '
    reporting:
      eligibility: 'Correction-eligible means an initial returned response with joint_pass

        false, including invalid proposals. Transport failures with no response

        are ineligible but remain in planned-cell denominators. Eligible cells

        not attempted because of budget or timeout remain in the eligible denominator.

        '
      required_metrics:
      - planned cells, attempted calls, completed artifacts, transport errors and missing results
      - initial applicable, literal, fidelity and joint pass counts over all planned cells
      - correction eligibility, attempts, completions, skips and failure categories
      - corrected applicable, literal, fidelity and joint passes over correction-eligible cells
      - paired pass-to-pass, pass-to-fail, fail-to-pass, fail-to-fail and unscorable transitions
      - rescued cases divided by correction-eligible cases, with applicability repairs separated
      - final selected joint passes over all planned cells and original-preserved count
      - per-voice, source cohort, mode, channel, mechanism and requested model breakdowns
      - latency, tokens and cost separately for generation, judgment and correction; unknowns explicit
      - revision replay retention and no-review control results
      interpretation: 'Unattempted passing controls are not measured pass-to-pass corrections.

        Missing and invalid results remain visible in planned denominators.

        Never report a cadence 2/2 as 10/10 overall qualification. This session''s

        judgments are development evidence, not independent human/author review.

        Reproducibility means traceable inputs and procedure, not guaranteed

        identical stochastic outputs or causal proof about model size.

        '
    recovery: 'Append timestamped stage events with input/output hashes. Resume only the

      first unfinished stage after verifying all dependencies. If a call may have

      completed, recover its receipt before any new call; unknown completion is a

      terminal error under zero retries. A session change requires an explicit

      recorded reviewer binding, never silent replacement. Stop at configured

      deadline or budget and report unfinished cells; do not discard them.

      '
    neutral_profile_policy:
      generator_fields:
      - opaque profile_id
      - generic style_description
      - analytical style_guidance
      - authentic style_examples
      - factual ledger
      - output constraints
      exclude_from_generation:
      - target-author names and aliases
      - biographies and persona instructions
      - author-keyed sample identifiers
      - source attribution paths
      - private provenance mapping
      - judge rankings and prior-case results
      provenance: Preserve identities, source attribution, hashes and mappings in private provenance records
        in configured remote artifact repository. Do not rewrite historical frozen packets.
      examples: Keep authentic excerpts verbatim when they contain no target-author name; select another
        attributable excerpt if a target name occurs. Do not falsely claim complete anonymity because
        a model may recognize the prose.
      audit: Audit both serialized initial and correction packets, including metadata, feedback, profile
        IDs and attribution paths, for mapped target names before each call. Store private provenance
        outside model-visible context.
      comparison: Generic guidance changes plus label removal are not a pure label-only ablation; declare
        all changed fields.
      storage: All evidence, reports and run manifests go to configured AIWG artifact root and are committed/pushed
        to its storage repository.
    qualification:
      status: selected-development-default
      historical_best: 9/15 joint; richer 9/9, technical 0/6; author-labelled Astra plus one correction
      neutral_generation_only: 2/9 joint; richer 2/3, technical 0/6; 9/9 fidelity
      combined_neutral_correction: not yet measured; do not assign the historical score
      scope: Existing profiles only; additional planned voices paused. No production-wide qualification.
  steps:
  - id: freeze
    agent: primary-session
    max_retries: 0
    inputs:
    - manifest.json
    - cases/
    - profiles/
    - rubric.json
    outputs:
    - path: frozen-inputs.json
      type: file
    prompt: 'Bind every role and required manifest field. Validate all sources, profile

      provenance, schemas and paths. Reject missing settings or ambiguous case

      identities. Freeze file and prompt hashes, inventory, order, budgets,

      rubric and reviewer identity before any model call. Record protocol version.


      Apply the neutral profile policy and record its audit before generation.

      '
  - id: generate
    agent: voice-generator
    depends_on:
    - freeze
    max_retries: 0
    inputs:
    - frozen-inputs.json
    - cases/
    - profiles/
    outputs:
    - path: initial/
      type: directory
    prompt: 'For each frozen cell, make exactly one isolated generation with the bound

      model and original task. Supply only the predeclared generation packet.

      Retain exact raw response and receipt, including errors. No feedback yet.

      '
  - id: validate-initial
    agent: deterministic-validator
    depends_on:
    - generate
    max_retries: 0
    inputs:
    - frozen-inputs.json
    - initial/
    outputs:
    - path: initial/validation.json
      type: file
    prompt: 'Per cell, strictly parse, apply against original source and check literal

      multiplicity. Save candidate only if applicable; bind all checks to hashes.

      '
  - id: criticize
    agent: primary-session
    depends_on:
    - validate-initial
    max_retries: 0
    inputs:
    - cases/
    - profiles/
    - rubric.json
    - initial/
    outputs:
    - path: initial/review.json
      type: file
    prompt: 'This parent session alone reviews every applicable candidate using the

      frozen review contract. For invalid outputs record null semantic/voice

      scores and precise application errors. Lock initial scores before any

      correction. Write evidence-linked criticism for each failed dimension.

      '
  - id: correct
    agent: voice-corrector
    depends_on:
    - criticize
    max_retries: 0
    inputs:
    - frozen-inputs.json
    - cases/
    - profiles/
    - initial/
    outputs:
    - path: correction/
      type: directory
    prompt: 'For each initially nonpassing cell with a returned response, verify hashes

      and make one isolated correction request using the full correction packet.

      Skip initial joint passes and transport failures with no response, recording

      distinct reasons. Retain exact output and receipts; no second attempt.

      '
  - id: validate-correction
    agent: deterministic-validator
    depends_on:
    - correct
    max_retries: 0
    inputs:
    - frozen-inputs.json
    - correction/
    outputs:
    - path: correction/validation.json
      type: file
    prompt: 'Run the identical strict validation and original-source application for

      each correction. Never loosen a constraint to accept a repair. Record skips.

      '
  - id: recheck
    agent: primary-session
    depends_on:
    - validate-correction
    max_retries: 0
    inputs:
    - cases/
    - profiles/
    - rubric.json
    - initial/review.json
    - correction/
    outputs:
    - path: correction/review.json
      type: file
    prompt: 'Reassess the entire corrected candidate, not merely listed criticisms.

      Check each issue''s resolution and new regressions. Use identical factual

      and cadence criteria. Record hash-bound judgment; never revise initial

      scores to make correction look better. Stop after this recheck.

      '
  - id: select-and-replay
    agent: primary-session
    depends_on:
    - recheck
    max_retries: 0
    inputs:
    - initial/
    - correction/
    - frozen-inputs.json
    outputs:
    - path: selection.json
      type: file
    - path: replay.json
      type: file
    prompt: 'Apply protocol selection rules for each cell. Replay selected proposals

      through production revision with their exact hash-bound reviews. Also run

      no-review controls for every applicable proposal: each must preserve the

      original. Any mismatch is a replay failure, not a selected success.

      Keep source originals whenever no reviewed candidate qualifies.

      '
  - id: report
    agent: primary-session
    depends_on:
    - select-and-replay
    max_retries: 0
    inputs:
    - manifest.json
    - frozen-inputs.json
    - initial/
    - correction/
    - selection.json
    - replay.json
    outputs:
    - path: summary.json
      type: file
    - path: RESULTS.md
      type: file
    prompt: 'Verify frozen hashes and terminal status for every planned cell. Produce

      all required metrics with explicit denominators and missingness. Report

      initial and corrected results side by side, concrete residual defects,

      configured workflow differences and reviewer limitations. Preserve raw

      evidence and reference the flow version. Do not enroll generated samples.

      '
  exit_criteria:
    gate: paired-results-and-replay-accounted
    decision:
    - COMPLETE_WITH_RESULTS
    - INCOMPLETE_BUDGET
    - INCOMPLETE_INPUT_DRIFT
    - INCOMPLETE_REVIEWER
