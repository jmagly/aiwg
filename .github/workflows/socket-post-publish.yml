name: Socket post-publish evidence

on:
  workflow_call:
    inputs:
      version:
        description: Published AIWG version to audit
        required: true
        type: string
      commit:
        description: Release source commit to audit
        required: true
        type: string
    secrets:
      SOCKET_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published AIWG version to audit
        required: true
        type: string
      tag:
        description: Immutable release tag to audit
        required: true
        type: string
      commit:
        description: Release source commit to audit
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

concurrency:
  group: socket-post-publish-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    # A free-plan Socket org (500 units/hour) cannot cover one release in a
    # single quota window, so the audit waits for the next window (see pace below).
    # 90 minutes npm visibility + 120 quota pacing + 75 pending scans + 30 overhead.
    timeout-minutes: 315
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize audit evidence
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/socket-post-publish"
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/workflow-status.md" <<EOF
          # Socket post-publish workflow status

          Status: started
          Stage: checkout
          Release: ${INPUT_VERSION}
          Ref: ${RELEASE_REF}
          EOF
          echo "evidence_dir=$EVIDENCE_DIR" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Checkout audited release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify exact release binding
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          STATUS_FILE="$evidence_dir/workflow-status.md"
          record_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: failed
          Stage: release-binding
          Release: ${INPUT_VERSION}
          Ref: ${RELEASE_REF}
          EOF
            fi
          }
          trap record_failure EXIT
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "Requested version $INPUT_VERSION does not match checked-out package version $VERSION" >&2
            exit 1
          fi
          if [ "$RELEASE_REF" != "refs/tags/v${VERSION}" ]; then
            echo "Socket audit must be bound to refs/tags/v${VERSION}; observed $RELEASE_REF" >&2
            exit 1
          fi
          TAG_COMMIT="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse "${RELEASE_REF}^{commit}")"
          if [ "$TAG_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Release tag commit $TAG_COMMIT does not match expected release source $EXPECTED_COMMIT" >&2
            exit 1
          fi
          ACTUAL_COMMIT="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Checked-out commit $ACTUAL_COMMIT does not match release tag commit $TAG_COMMIT" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: passed
          Stage: release-binding
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          Commit: ${TAG_COMMIT}
          EOF

      - name: Wait for published npm versions
        id: npm_visibility
        shell: sh
        env:
          NPM_VISIBILITY_WAIT_MINUTES: ${{ vars.SOCKET_NPM_VISIBILITY_WAIT_MINUTES || '45' }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -eu
          case "$NPM_VISIBILITY_WAIT_MINUTES" in
            [1-9]|[1-8][0-9]|90) ;;
            *) echo "SOCKET_NPM_VISIBILITY_WAIT_MINUTES must be an integer from 1 to 90" >&2; exit 1 ;;
          esac
          DEADLINE=$(( $(date +%s) + NPM_VISIBILITY_WAIT_MINUTES * 60 ))
          while :; do
            AVAILABLE=true
            for PACKAGE in aiwg @aiwg/cli @aiwg/cockpit @aiwg/flue; do
              REMAINING=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAINING" -le 0 ]; then
                AVAILABLE=false
                break
              fi
              VISIBLE_VERSION=$(timeout "$REMAINING" npm view "$PACKAGE@$VERSION" version \
                --fetch-retries=0 --fetch-timeout=30000 2>/dev/null) || VISIBLE_VERSION=
              if [ "$VISIBLE_VERSION" != "$VERSION" ]; then
                echo "Waiting for npm visibility: $PACKAGE@$VERSION"
                AVAILABLE=false
              fi
            done
            if [ "$AVAILABLE" = true ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            REMAINING=$(( DEADLINE - $(date +%s) ))
            if [ "$REMAINING" -le 0 ]; then
              break
            fi
            SLEEP_SECONDS=30
            if [ "$REMAINING" -lt "$SLEEP_SECONDS" ]; then
              SLEEP_SECONDS=$REMAINING
            fi
            sleep "$SLEEP_SECONDS"
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          TAG=${RELEASE_REF#refs/tags/}
          cat > "$evidence_dir/workflow-status.md" <<EOF
          # Socket post-publish workflow status

          Status: unavailable: npm-review-pending
          Stage: npm-visibility
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          Commit: ${COMMIT}

          Published npm versions were not all visible within ${NPM_VISIBILITY_WAIT_MINUTES} minutes.
          Re-dispatch after npm review completes:

          gh workflow run socket-post-publish.yml --repo jmagly/aiwg --ref main -f version=${VERSION} -f tag=${TAG} -f commit=${COMMIT}
          EOF
          cat "$evidence_dir/workflow-status.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build published dependency inventory
        if: steps.npm_visibility.outputs.available == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          STATUS_FILE="$evidence_dir/workflow-status.md"
          record_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: failed
          Stage: dependency-inventory
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          EOF
            fi
          }
          trap record_failure EXIT
          AUDIT_ROOT="$RUNNER_TEMP/aiwg-socket-audit"
          mkdir -p "$AUDIT_ROOT"
          npm install --prefix "$AUDIT_ROOT" --package-lock-only --ignore-scripts --no-audit --no-fund \
            "aiwg@$VERSION" "@aiwg/cli@$VERSION" "@aiwg/cockpit@$VERSION" "@aiwg/flue@$VERSION"
          echo "dependency_lock=$AUDIT_ROOT/package-lock.json" >> "$GITHUB_ENV"
          cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: passed
          Stage: dependency-inventory
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          EOF

      - name: Install audit script runtime dependencies
        # The audit script imports production dependencies (for example semver)
        # from the checked-out release source; install them without lifecycle scripts.
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Query Socket and evaluate baseline
        id: socket
        if: steps.npm_visibility.outputs.available == 'true'
        continue-on-error: true
        env:
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
          SOCKET_ORG_SLUG: ${{ vars.SOCKET_ORG_SLUG }}
          SOCKET_PACE_QUOTA_MINUTES: ${{ vars.SOCKET_PACE_QUOTA_MINUTES || '120' }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -uo pipefail
          STATUS_FILE="$evidence_dir/workflow-status.md"
          cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: started
          Stage: socket-audit
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          EOF
          if node tools/release/socket-post-publish-audit.mjs \
            --version "$VERSION" \
            --dependency-lock "$dependency_lock" \
            --dependency-lock package-lock.json \
            --dependency-lock agentic/code/addons/droid-bridge/package-lock.json \
            --dependency-lock agentic/code/plugins/droid-bridge/package-lock.json \
            --dependency-lock tools/eval/package-lock.json \
            --dependency-lock apps/cockpit/desktop/src-tauri/Cargo.lock \
            --commit "$COMMIT" \
            --organization "${SOCKET_ORG_SLUG}" \
            --output-dir "$evidence_dir"; then
            AUDIT_STATUS=passed
          else
            AUDIT_STATUS=failed
          fi
          cat > "$STATUS_FILE" <<EOF
          # Socket post-publish workflow status

          Status: ${AUDIT_STATUS}
          Stage: socket-audit
          Release: ${VERSION}
          Ref: ${RELEASE_REF}
          Commit: ${COMMIT}
          EOF
          [ "$AUDIT_STATUS" = passed ]

      - name: Upload Socket evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: socket-post-publish-${{ steps.release.outputs.version || inputs.version }}
          path: ${{ runner.temp }}/socket-post-publish/
          if-no-files-found: error

      - name: Enforce audit result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.socket.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "Socket evidence is failing or unavailable; inspect the uploaded report."
            exit 1
          fi
