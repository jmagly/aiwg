# Historical, manual-only signed RC validation and immutable artifact retention.
# A maintainer may select the routine or quarterly profile; this workflow never
# schedules model comparisons and is not a stable-publication gate.
name: Validate release candidate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Validation cadence (dispatch with --ref set to the signed RC tag)'
        required: true
        default: 'routine-release-v1'
        type: choice
        options:
          - 'routine-release-v1'
          - 'quarterly-full-v1'

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      # Full release lanes exceed the generic ten-minute child-process bound.
      # Their owned hang-report wrappers impose the narrower lane deadlines.
      AIWG_SYNC_LONG_TIMEOUT_MS: '3600000'
      AIWG_PERF_BUDGET_VERSION_MS: '300'
      AIWG_PERF_BUDGET_HELP_MS: '750'
      AIWG_PERF_SAMPLE_COUNT: '7'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout RC source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Restore annotated tag object and require main ancestry
        id: source
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" '+refs/heads/main:refs/remotes/origin/main'
          git checkout --detach "refs/tags/${GITHUB_REF_NAME}"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify signed RC tag
        env:
          AIWG_VERIFY_TAG_REF: ${{ github.ref }}
        run: bash tools/ci/verify-signed-tag.sh

      - name: Validate RC tag identity
        run: node tools/release/release-candidate.mjs identity --tag "$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Flue example dependencies for the offline release lane
        run: npm ci --prefix examples/flue-node

      - name: Install mandatory SQLite session test backend
        run: |
          npm run features:sqlite
          node -e "require('better-sqlite3')"

      - name: Scan known affected package feed
        run: |
          if [ -n "${AIWG_AFFECTED_PACKAGES_CSV:-}" ] || [ -f /mnt/ops/users/roctinam/Downloads/22-packages.csv ]; then
            npm run lint:affected-packages
          else
            echo 'No configured affected-package feed (same policy as main CI).'
          fi

      - name: Resolve validation profile
        id: validation_profile
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            PROFILE='routine-release-v1'
          else
            PROFILE="${INPUT_PROFILE:-}"
          fi
          case "$PROFILE" in
            routine-release-v1|quarterly-full-v1) ;;
            *) echo "Unknown release validation profile: ${PROFILE:-<empty>}" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Run release validation profile
        run: node tools/release/release-candidate.mjs validate --profile '${{ steps.validation_profile.outputs.profile }}' --output "$RUNNER_TEMP/rc-candidate/validation.json"

      - name: Require provider sandbox tests when supported
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1 && bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --ro-bind / / -- /bin/true; then
            AIWG_REQUIRE_PROVIDER_SANDBOX=1 ./node_modules/.bin/vitest run --config config/vitest.config.js --maxWorkers=2 \
              test/conformance/gates-v1/gates-provider-sandbox.test.ts \
              test/conformance/gates-v1/gates-provider-isolation.test.ts \
              test/conformance/gates-v1/gates-bundle-providers.test.ts
          else
            echo 'Provider sandbox runtime unavailable (same capability policy as main CI).'
          fi

      - name: Pack and smoke-test exact npm surfaces
        run: node tools/release/release-candidate.mjs pack --output "$RUNNER_TEMP/rc-candidate"

      - name: Install syft (SBOM generator)
        # syft v1.18.0 — see ci/digests.txt "Standalone tools" section.
        run: |
          set -euo pipefail
          SYFT_VERSION='v1.18.0'
          SYFT_ARCHIVE='syft_1.18.0_linux_amd64.tar.gz'
          SYFT_SHA256='0b6fd1e0dd5b00b19585e5cde8e1c1f4ef60dc8fba8b41fab55f00852a2fbb8d'
          SYFT_TMP_DIR="$(mktemp -d)"
          trap 'find "$SYFT_TMP_DIR" -type f -delete; rmdir "$SYFT_TMP_DIR"' EXIT
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_ARCHIVE}" \
            -o "$SYFT_TMP_DIR/$SYFT_ARCHIVE"
          printf '%s  %s\n' "$SYFT_SHA256" "$SYFT_TMP_DIR/$SYFT_ARCHIVE" | sha256sum -c -
          tar -xzf "$SYFT_TMP_DIR/$SYFT_ARCHIVE" -C "$SYFT_TMP_DIR" syft
          install -m 0755 "$SYFT_TMP_DIR/syft" /usr/local/bin/syft
          syft version

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          syft scan dir:. --output cyclonedx-json="$RUNNER_TEMP/rc-candidate/aiwg-${VERSION}.cdx.json"
          test -s "$RUNNER_TEMP/rc-candidate/aiwg-${VERSION}.cdx.json"

      - name: Preserve exact installer
        run: |
          set -euo pipefail
          cp tools/install/install.sh "$RUNNER_TEMP/rc-candidate/install.sh"
          bash "$RUNNER_TEMP/rc-candidate/install.sh" --dry-run

      - name: Write RC artifact manifest
        run: node tools/release/release-candidate.mjs manifest --output "$RUNNER_TEMP/rc-candidate" --tag "$GITHUB_REF_NAME"

      - name: Retain validated release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ steps.source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve failed validation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-candidate/
          if-no-files-found: warn
          retention-days: 14
