# Main CI Workflow
#
# Runs on all pushes and pull requests to main/develop.
# Executes tests, type checking, and linting.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # npm 10.8.2 in the Node 20 image cannot validate packages signed after
    # npm's registry-key rotation. Keep the signature hard gate on the same
    # digest-pinned npm 11 runtime used by the publication workflow.
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 / npm 11.12.1 (see ci/digests.txt)
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # Plain `npm ci` (no --omit=optional). Sharp's prebuilt libvips
        # binary is in its optionalDependencies — skipping optional deps
        # forced sharp to fall back to a from-source gyp build that needed
        # libvips-dev system headers (#1018). Other workflows already use
        # plain `npm ci` and resolve sharp without issue.
        run: npm ci

      - name: Lint dependency sources (#1300)
        # Scans package.json + package-lock.json for git+, git://, github:,
        # file:, link:, and non-registry tarball sources. Closes the Mini
        # Shai-Hulud dep-injection vector (control C22). Allowlist lives at
        # ci/dep-source-allowlist.yaml; see ADR adr-dep-source-policy.md and
        # docs/contributing/dependency-sources.md.
        run: npm run lint:dep-sources

      - name: Reject eval-backed module import shims (#2082)
        # Optional integrations stay lazy, but must use native import() rather
        # than eval()/Function() code-generation wrappers.
        run: npm run lint:eval-imports

      - name: Verify published license boundaries (#2083)
        # Legal templates contain illustrative policy data. Require explicit
        # SPDX file metadata so those examples cannot masquerade as the
        # distribution license of the package that carries them.
        run: npm run lint:package-license-boundary

      - name: Scan known affected package feed (#1353)
        # Reads the operator-maintained CSV feed from either the canonical
        # mounted path or AIWG_AFFECTED_PACKAGES_CSV. In CI, prefer a raw gist
        # URL or another immutable published snapshot so the run is auditable.
        run: |
          if [ -n "${AIWG_AFFECTED_PACKAGES_CSV:-}" ] || [ -f /mnt/ops/users/roctinam/Downloads/22-packages.csv ]; then
            npm run lint:affected-packages
          else
            echo "Skipping affected-package scan: no CSV source configured on this runner"
          fi

      - name: Audit dep-graph signatures (#1288 / A12)
        # Runs on every push (not just publish) so signature regressions
        # in the dep graph surface quickly. Time-bounded waivers live in
        # ci/npm-audit-signatures-waivers.yaml — expired waivers fail.
        # See .aiwg/architecture/adr-publish-time-evidence.md.
        run: npm run lint:audit-signatures

      - name: Lint deployed agent definition sizes (#1602)
        # Hard gate for the 16 KiB subagent dispatch ceiling. The script scans
        # deployed provider agent defs and allows only the documented
        # security-auditor outlier from #1587.
        run: npm run lint:agent-sizes

      - name: Run type check
        run: npm run typecheck

      - name: Build CLI (required by integration tests that spawn bin/aiwg.mjs)
        run: npm run build:cli

      - name: Verify test runner ownership
        run: npm run lint:test-registration

      - name: Enforce measured testing-quality and audit-foundation coverage
        run: npm run test:coverage:testing-quality && npm run test:coverage:audit-foundations && npm run test:coverage:enforcement

      - name: Run source-bound testing conformance example
        run: npm run test:conformance:example

      - name: Preserve testing conformance evidence
        if: always()
        uses: actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d  # v3.2.1-node20
        with:
          name: testing-conformance-${{ gitea.sha }}
          path: |
            test-results/conformance-example
            test-results/test-registration.json
            test-results/testing-quality-coverage
            test-results/audit-foundations-coverage
            test-results/coverage-enforcement
          if-no-files-found: error

      - name: Lint schemas
        # Validates schemas/executor-v1.json (draft-2020-12) and all
        # fixtures in test/conformance/executor-v1/fixtures/ against it.
        # Fails the build if the schema is structurally invalid or a fixture
        # violates the declared _validates_as shape. (#1178)
        run: npm run lint:schemas

      - name: Validate ops extension templates
        # Discovers every extension YAML template, resolves core and custom
        # kinds through ADDON.yaml, and fails on schema or reference drift.
        run: npm run lint:ops-templates

      - name: Enforce Mission Protocol inventory and compatibility (#2178/#2180)
        # Fails when a new Mission producer/consumer is unclassified or when
        # mission.aiwg.io/v1 changes without an explicit version-policy verdict.
        run: npm run lint:mission-inventory && npm run lint:mission-contract

      - name: Lint tracked generated artifacts
        # Keeps local build outputs, provider exports, indexes, caches,
        # coverage, and test results out of git unless explicitly allowlisted.
        run: npm run lint:generated-artifacts

      - name: Verify vault CI migration
        # Local-only gate: validates workflow secret references, vault fetch
        # specs, the AppRole policy, and migration docs without reading live
        # secret values. Live metadata is checked separately after induction.
        run: npm run lint:vault-migration

      - name: Run contracts in their owning Vitest and Node lanes
        run: npm run test:contract

      - name: Run conformance suite (fixture mode)
        # Exercises the executor-contract v1 dispatch path via fixture replay.
        # Runs as a separate step (not folded into test:ci) to keep the existing
        # CI budget intact. Zero network I/O — fully deterministic. (#1183)
        run: npm run test:conformance

      - name: Run Dataset Intelligence conformance contracts (#2242)
        run: npm run test:conformance:dataset

      - name: Enforce adversarial attestation transport conformance (#2092)
        # Regenerates deterministic real-key fixtures, rejects drift, and proves
        # identical non-waiveable outcomes across every supported transport.
        run: npm run test:security:attestation-conformance

      - name: Run node test suite (ralph-external + ralph)
        # The tools/ralph-external/*.test.mjs and test/unit/ralph/*.test.mjs
        # suites are excluded from the vitest config and only run via node
        # --test. Before #1774 they ran nowhere in CI, so the LFD analytics/
        # budget/usage/stall/schema-validation coverage — and the multi-loop
        # registry/state-manager suites — were unenforced. The registry/
        # state-manager suites' async rot (#1777) is now fixed, so the full
        # `test:node` set is gated here. Deterministic, no network.
        run: npm run test:node

      - name: Install SQLite test backend
        # Keep native prebuild plumbing out of the default/package-lock install
        # tree while making the optional production backend mandatory in CI.
        # This exact-version follow-up must not re-resolve the already-locked
        # graph through the seven-day age filter; match the publish gate.
        run: npm install --no-save --save-dev --package-lock=false --min-release-age=0 better-sqlite3@12.8.0

      - name: Run storage backend conformance gate (#2190/#2191)
        # Enforces the zero-dependency golden corpus, migration safety/fault
        # protocol, qualification negative controls, and PostgreSQL transport
        # contracts. Live server suites remain isolated integration jobs.
        run: npm run test:conformance:storage

      - name: Verify source-bound storage benchmark claims (#2191)
        run: npm run verify:storage-claims

      - name: Sanitize session regression corpus
        # Reject credential, personal-path, host-identity, and provenance drift
        # before any fixture reaches the mandatory session test layers.
        run: npm run lint:session-fixtures

      - name: Run mandatory SQLite session suites
        # Loads the native backend first, then emits and validates separate
        # adapter and cross-provider reports with zero skipped tests.
        run: npm run test:sessions:sqlite

      - name: Run production-path session performance gates
        # Preserves a machine-readable profile, raw samples, budgets, and gate
        # outcomes at test-results/session-performance.json.
        run: npm run benchmark:sessions

      - name: Preserve session performance evidence
        if: always()
        # Gitea Actions does not implement the artifact-service v2 protocol
        # required by upload-artifact v4. Keep this Gitea workflow on the
        # final Node 20-compatible v3 release; GitHub workflows remain on v4.
        uses: actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d  # v3.2.1-node20
        with:
          name: session-performance-${{ gitea.sha }}
          path: test-results/session-performance.json
          if-no-files-found: error

      - name: Run tests
        env:
          # Shared-runner policy: paired Node baselines, median of 7 samples.
          AIWG_PERF_BUDGET_VERSION_MS: "300"
          AIWG_PERF_BUDGET_HELP_MS: "750"
          AIWG_PERF_SAMPLE_COUNT: "7"
        run: npm run test:ci

      - name: Run tier-3 integration suite (#1174)
        # Spawns aiwg serve via bin/aiwg.mjs on an ephemeral port. The
        # readiness probe targets /api/health (a known-registered route)
        # which was the missing piece — root-URL probes returned 503 in CI
        # because apps/web/dist isn't built before this step, but /api/health
        # is route-registered before the Dashboard banner prints (#1277).
        env:
          # Allow the serve startup banner up to 30s in docker-in-docker.
          AIWG_SERVE_HTTP_TIMEOUT_MS: "30000"
        run: npm run test:integration:serve

  # Full-corpus index performance, real package installation/build, and
  # full-corpus discovery are isolated gates. They must not compete with the
  # general test workers or each other while measuring repository-scale work.
  artifact-index:
    name: Artifact index integration
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated full-corpus artifact index tests
        run: npm run test:integration:artifact-index

  packaging:
    name: Package lifecycle
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install locked dependencies
        run: npm ci
      - name: Build release prerequisites
        # Match both publish workflows: the root package intentionally ships
        # apps/web/dist, so a CLI-only build produces an incomplete dry-run.
        run: npm run build
      - name: Run isolated packaging lifecycle tests
        run: npm run test:packaging

  release-discovery:
    name: Release discovery and installed package
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install locked dependencies
        run: npm ci
      - name: Build CLI prerequisites
        run: npm run build:cli
      - name: Verify real corpus, tarball and installed discovery
        run: npm run ci:fortemi-index

  build:
    name: Build
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 / npm 11.12.1 (see ci/digests.txt)
    timeout-minutes: 10
    needs: [test, packaging, release-discovery]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        # Plain `npm ci` — see ci.yml Test job comment re: sharp + libvips (#1018).
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/ || echo "dist/ directory not found"
          ls -la dist/src/ || echo "dist/src/ directory not found"

      - name: Verify .aiwg/ excluded from build
        run: |
          if [ -d "dist/.aiwg" ] || find dist/ -path '*/.aiwg/*' 2>/dev/null | grep -q .; then
            echo "FATAL: .aiwg/ content found in build output!"
            exit 1
          fi
          echo "✓ .aiwg/ correctly excluded from build output"
