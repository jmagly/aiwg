name: Release infrastructure tests

on:
  workflow_dispatch:

jobs:
  release-slow:
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: npm ci
      - run: npm ci --prefix examples/flue-node
      - run: npm run build:cli
      - name: Run release infrastructure lane
        run: node tools/ci/run-with-hang-report.mjs --timeout 30m -- npm run test:release-slow
