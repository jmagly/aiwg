# Build and Package Plugins
#
# Packages Claude Code plugins on tag push or manual dispatch.
# Note: npm publishing happens via GitHub Actions (requires npm provenance).

name: Build Plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean plugins directory before building'
        required: false
        default: true
        type: boolean

concurrency:
  group: build-plugins
  cancel-in-progress: false

jobs:
  build:
    name: Package Plugins
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 (see ci/digests.txt)
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        run: npm ci

      - name: Package plugins
        run: |
          if [ "${{ github.event.inputs.clean }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            npm run package-plugins:clean
          else
            npm run package-plugins
          fi

      - name: Validate plugin manifests
        run: |
          echo "Validating plugin manifests..."
          # Codex plugins are registered via .agents/plugins/marketplace.json
          # instead of per-plugin .claude-plugin/plugin.json. Accept either.
          CODEX_MARKETPLACE=".agents/plugins/marketplace.json"
          for plugin in agentic/code/plugins/*/; do
            name=$(basename "$plugin")
            if [ -f "$plugin.claude-plugin/plugin.json" ]; then
              echo "✓ $name: claude manifest valid"
              cat "$plugin.claude-plugin/plugin.json" | head -5
            elif [ -f "$plugin.codex-plugin/plugin.json" ]; then
              echo "✓ $name: codex manifest valid"
              cat "$plugin.codex-plugin/plugin.json" | head -5
            elif [ -f "$CODEX_MARKETPLACE" ] && grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"$name\"" "$CODEX_MARKETPLACE"; then
              echo "✓ $name: registered in codex marketplace"
            elif [ "$name" = "codex-sdlc" ] && [ -f "$plugin/skills/manifest.json" ]; then
              # codex-sdlc is the checked-in provider-native Codex bundle, not
              # one of the independently installable Claude marketplace
              # plugins generated above. Its skill manifest is its registry.
              echo "✓ $name: provider-native Codex bundle manifest valid"
            else
              echo "✗ $name: missing manifest (no .claude-plugin/plugin.json, .codex-plugin/plugin.json, or codex marketplace entry)"
              exit 1
            fi
          done

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace.json..."
          if [ -f ".claude-plugin/marketplace.json" ]; then
            echo "✓ marketplace.json exists at .claude-plugin/"
            cat ".claude-plugin/marketplace.json" | head -20
          elif [ -f "marketplace.json" ]; then
            echo "✓ marketplace.json exists at repo root"
            cat "marketplace.json" | head -20
          elif [ -f "agentic/code/plugins/.claude-plugin/marketplace.json" ]; then
            echo "✓ marketplace.json exists in agentic/code/plugins/"
            cat "agentic/code/plugins/.claude-plugin/marketplace.json" | head -20
          else
            echo "✗ marketplace.json missing"
            exit 1
          fi

      - name: Verify .aiwg/ excluded from plugins
        run: |
          FOUND=0
          for plugin in agentic/code/plugins/*/; do
            if find "$plugin" -path '*/.aiwg/*' 2>/dev/null | grep -q .; then
              echo "FATAL: .aiwg/ content found in plugin $(basename $plugin)!"
              find "$plugin" -path '*/.aiwg/*'
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ".aiwg/ is project-local SDLC artifacts — must never be in plugins."
            exit 1
          fi
          echo "✓ .aiwg/ correctly excluded from all plugins"

      - name: Build summary
        run: |
          echo "## Plugin Build Complete"
          echo ""
          echo "### Built Plugins:"
          for plugin in agentic/code/plugins/*/; do
            if [ -d "$plugin" ]; then
              echo "- $(basename $plugin)"
            fi
          done
          echo ""
          echo "**Note**: npm publishing happens via GitHub Actions."

  test-shards:
    name: Validate tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 (see ci/digests.txt)
    needs: build
    # Each half of the default lane gets the same 20-minute command watchdog as a
    # ci.yml shard; 10 minutes timed out on a busy runner at v2026.10.9.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        run: npm ci

      - name: Install mandatory SQLite session test backend
        # Keep the plugin validation gate aligned with ci.yml and publish
        # workflows: the full test suite contains mandatory SQLite-backed
        # session conformance tests.
        run: |
          npm install --no-save --save-dev --package-lock=false --min-release-age=0 better-sqlite3@12.8.0
          node -e "require('better-sqlite3')"

      - name: Run type check
        run: npm run typecheck

      - name: Build CLI (required by integration tests that spawn bin/aiwg.mjs)
        run: npm run build:cli

      - name: Verify native shard inventory
        run: node tools/testing/check-native-shards.mjs 2

      - name: Run default test shard
        env:
          # Shared-runner policy: paired Node baselines, median of 7 samples.
          AIWG_PERF_BUDGET_VERSION_MS: "300"
          AIWG_PERF_BUDGET_HELP_MS: "750"
          AIWG_PERF_SAMPLE_COUNT: "7"
        # Bound workers as in source CI; retain all per-test deadlines and
        # the owned TMPDIR/leak gate supplied by npm test.
        run: node tools/ci/run-with-hang-report.mjs --timeout 20m -- npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=4

  deployment:
    name: Provider deployment integration (shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AIWG_DEPLOYMENT_SHARD: ${{ matrix.shard }}
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    needs: build
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        run: npm ci

      - name: Build CLI prerequisites
        run: npm run build:cli

      - name: Run provider deployment integration lane
        run: node tools/ci/run-with-hang-report.mjs --timeout 18m -- npm run test:deployment

  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    needs: [build, test-shards, deployment]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Require all plugin validation jobs
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.test-shards.result }}" = success
          test "${{ needs.deployment.result }}" = success
