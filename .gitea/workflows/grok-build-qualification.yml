name: Grok Build qualification contract

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/providers/provider-definitions.ts'
      - 'src/providers/grok-build-*.ts'
      - 'tools/agents/providers/grok-build.mjs'
      - 'tools/providers/grok-build-native-smoke.mjs'
      - 'docs/providers/grok-build-qualification.json'
      - 'tools/providers/grok-build-qualification.mjs'
      - '.gitea/workflows/grok-build-qualification.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/providers/provider-definitions.ts'
      - 'src/providers/grok-build-*.ts'
      - 'tools/agents/providers/grok-build.mjs'
      - 'tools/providers/grok-build-native-smoke.mjs'
      - 'docs/providers/grok-build-qualification.json'
      - 'tools/providers/grok-build-qualification.mjs'
      - '.gitea/workflows/grok-build-qualification.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

jobs:
  qualification:
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Enforce stable-promotion contract
        run: node tools/providers/grok-build-qualification.mjs gate
      - name: Test qualification negative controls
        run: node --test test/unit/providers/grok-build-qualification.test.mjs
      - name: Detect upstream source/config drift
        if: gitea.event_name == 'schedule' || gitea.event_name == 'workflow_dispatch'
        run: node tools/providers/grok-build-qualification.mjs drift
      - name: Live headless smoke (explicit secret gate and SHA-pinned binary)
        env:
          AIWG_GROK_BUILD_LIVE_SMOKE: ${{ secrets.AIWG_GROK_BUILD_LIVE_SMOKE }}
          AIWG_GROK_BUILD_BIN: ${{ vars.AIWG_GROK_BUILD_BIN }}
          AIWG_GROK_BUILD_EXPECTED_SHA256: ${{ vars.AIWG_GROK_BUILD_EXPECTED_SHA256 }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node tools/providers/grok-build-native-smoke.mjs
